name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # Windows installer
  windows:
    name: Build Windows Installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          echo "VERSION=$tag" >> $env:GITHUB_OUTPUT
          echo "Version: $tag"

      - name: Publish
        run: dotnet publish Shuka.Windows/Shuka.Windows.csproj -c Release -r win-x64 --self-contained true -o Shuka.Windows/bin/publish -p:Version=${{ steps.version.outputs.VERSION }} -p:AssemblyVersion=${{ steps.version.outputs.VERSION }}.0 -p:FileVersion=${{ steps.version.outputs.VERSION }}.0 -p:InformationalVersion=${{ steps.version.outputs.VERSION }}

      - name: Install Playwright browsers
        run: Shuka.Windows/bin/publish/Shuka.exe playwright install chromium

      - name: Build installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: Shuka.Windows/installer.iss
          options: /DMyAppVersion=${{ github.ref_name }}

      - name: Rename installer
        id: rename_installer
        shell: pwsh
        run: |
          $tag     = "${{ github.ref_name }}"
          $newName = "Shuka-Windows-$tag.exe"
          Move-Item "installer_output\Shuka_Setup.exe" "installer_output\$newName"
          echo "INSTALLER_PATH=installer_output\$newName" >> $env:GITHUB_OUTPUT
          echo "INSTALLER_NAME=$newName"                  >> $env:GITHUB_OUTPUT

      - name: Zip installer
        id: zip_installer
        shell: pwsh
        run: |
          $tag     = "${{ github.ref_name }}"
          $zipName = "Shuka-Windows-$tag.zip"
          Compress-Archive -Path "${{ steps.rename_installer.outputs.INSTALLER_PATH }}" -DestinationPath $zipName
          echo "ZIP_PATH=$zipName" >> $env:GITHUB_OUTPUT

      - name: Build changelog
        id: changelog
        shell: pwsh
        run: |
          # Get the previous tag; fall back to first commit if this is the first tag
          $prev = git describe --tags --abbrev=0 HEAD^ 2>$null
          if (-not $prev) { $prev = git rev-list --max-parents=0 HEAD }

          $commits = git log "$prev..HEAD" --pretty=format:"%s (%h)" --no-merges -- . ":(exclude)README.md" ":(exclude)README*.md"
          if (-not $commits) {
            $bullets = "- Initial release"
          } else {
            # Prefix each line with "- " and join with Unix newlines
            $bullets = ($commits -split "`n" | ForEach-Object { "- $_" }) -join "`n"
          }

          # Write with Unix line endings so GitHub renders bullets correctly
          $content = $bullets
          [IO.File]::WriteAllText("changelog.txt", $content + "`n")
          echo "FILE=changelog.txt" >> $env:GITHUB_OUTPUT

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          name: Shuka ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: changelog.txt
          make_latest: true
          files: |
            ${{ steps.rename_installer.outputs.INSTALLER_PATH }}
            ${{ steps.zip_installer.outputs.ZIP_PATH }}

  # Android APK
  android:
    name: Build Android APK
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"

      - name: Decode keystore
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.KEYSTORE_BASE64 }}")
          [IO.File]::WriteAllBytes("${{ github.workspace }}\shuka.keystore", $bytes)
        shell: pwsh

      - name: Compute version code
        id: version
        shell: pwsh
        run: |
          # Convert vX.Y.Z → integer: X*10000 + Y*100 + Z
          # e.g. v1.2.3 → 10203, v1.1.0 → 10100
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $parts = $tag -split '\.'
          $major = [int]$parts[0]
          $minor = if ($parts.Length -gt 1) { [int]$parts[1] } else { 0 }
          $patch = if ($parts.Length -gt 2) { [int]$parts[2] } else { 0 }
          $code = $major * 10000 + $minor * 100 + $patch
          echo "VERSION_CODE=$code" >> $env:GITHUB_OUTPUT
          echo "Version code: $code"

      - name: Build Release APK
        run: >
          dotnet publish Shuka.Android/Shuka.Android.csproj
          -f net10.0-android
          -c Release
          -p:RuntimeIdentifier=android-arm64
          -p:AndroidSigningKeyStore=${{ github.workspace }}\shuka.keystore
          -p:AndroidSigningKeyAlias=${{ secrets.KEY_ALIAS }}
          -p:AndroidSigningKeyPass=${{ secrets.KEY_PASSWORD }}
          -p:AndroidSigningStorePass=${{ secrets.STORE_PASSWORD }}
          -p:AndroidPackageFormats=apk
          -p:ApplicationVersion=${{ steps.version.outputs.VERSION_CODE }}
          -p:ApplicationDisplayVersion=${{ github.ref_name }}
          -o publish_output

      - name: Locate APK
        id: find_apk
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Recurse -Filter "*.apk" publish_output | Select-Object -First 1
          echo "APK_PATH=$($apk.FullName)" >> $env:GITHUB_OUTPUT
          echo "APK_NAME=$($apk.Name)"     >> $env:GITHUB_OUTPUT

      - name: Rename APK
        id: rename_apk
        shell: pwsh
        run: |
          $tag     = "${{ github.ref_name }}"
          $newName = "Shuka-Android-$tag.apk"
          $newPath = Join-Path (Split-Path "${{ steps.find_apk.outputs.APK_PATH }}") $newName
          Move-Item "${{ steps.find_apk.outputs.APK_PATH }}" $newPath
          echo "APK_PATH=$newPath" >> $env:GITHUB_OUTPUT
          echo "APK_NAME=$newName" >> $env:GITHUB_OUTPUT

      - name: Zip APK
        id: zip_apk
        shell: pwsh
        run: |
          $tag     = "${{ github.ref_name }}"
          $zipName = "Shuka-Android-$tag.zip"
          Compress-Archive -Path "${{ steps.rename_apk.outputs.APK_PATH }}" -DestinationPath $zipName
          echo "ZIP_PATH=$zipName" >> $env:GITHUB_OUTPUT

      - name: Build changelog
        id: changelog
        shell: pwsh
        run: |
          $prev = git describe --tags --abbrev=0 HEAD^ 2>$null
          if (-not $prev) { $prev = git rev-list --max-parents=0 HEAD }

          $commits = git log "$prev..HEAD" --pretty=format:"%s (%h)" --no-merges -- . ":(exclude)README.md" ":(exclude)README*.md"
          if (-not $commits) {
            $bullets = "- Initial release"
          } else {
            # Prefix each line with "- " and join with Unix newlines
            $bullets = ($commits -split "`n" | ForEach-Object { "- $_" }) -join "`n"
          }

          $body = @"
          ## Shuka ${{ github.ref_name }}

          ### What's changed
          $bullets


          | File | Platform |
          |------|----------|
          | ``Shuka-Windows-${{ github.ref_name }}.exe`` | Windows installer |
          | ``Shuka-Windows-${{ github.ref_name }}.zip`` | Windows installer in ZIP |
          | ``Shuka-Android-${{ github.ref_name }}.apk`` | Android direct install |
          | ``Shuka-Android-${{ github.ref_name }}.zip`` | Android APK in ZIP |

          "@

          # Write with Unix line endings
          [IO.File]::WriteAllText("release_body.txt", $body + "`n")
          echo "FILE=release_body.txt" >> $env:GITHUB_OUTPUT

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          name: Shuka ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release_body.txt
          make_latest: true
          files: |
            ${{ steps.rename_apk.outputs.APK_PATH }}
            ${{ steps.zip_apk.outputs.ZIP_PATH }}
