name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install workloads
        run: dotnet workload restore

      - name: Restore
        run: dotnet restore

      - name: Build Windows
        run: dotnet build Shuka.Windows/Shuka.Windows.csproj -c Release --no-restore

      - name: Build Android (Debug)
        run: dotnet build Shuka.Android/Shuka.Android.csproj -c Debug --no-restore
